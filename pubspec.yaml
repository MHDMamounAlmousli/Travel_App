name: mobile_travel_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
      sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:

  uses-material-design: true
#  assets:
#     - images/

  fonts:
     - family: Amiri
       fonts:
         - asset: Assests/Fonts/Amiri-Regular.ttf
         - asset: Assests/Fonts/Amiri-Bold.ttf
           weight: 600

     - family: ElMessiri
       fonts:
        - asset: Assests/Fonts/ElMessiri-Regular.ttf
        - asset: Assests/Fonts/ElMessiri-SemiBold.ttf
          weight: 600
        - asset: Assests/Fonts/ElMessiri-Bold.ttf
          weight: 700


